name: build-site
on:
  push:
    paths: ["src/**", "tools.json", "scripts/build.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build.mjs
      - run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A -- '*.html'
          git diff --cached --quiet || (git commit -m "Build site" && git push)
